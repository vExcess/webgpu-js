<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title>hello-triangle</title>
   <script src="webgpu.js"></script>
</head>
<body>
<canvas id="c" width="400" height="300"></canvas>
<script>
const SHADER = `
@vertex
fn vs_main(@location(0) pos: vec2f) -> @builtin(position) vec4f {
   return vec4f(pos, 0.0, 1.0);
}

@fragment
fn fs_main() -> @location(0) vec4f {
   return vec4f(1.0, 0.3, 0.3, 1.0);
}
`;

(async () => {
   const adapter = await navigator.gpu.requestAdapter();
   if (!adapter) throw new Error('No GPU adapter (WebGL 2 required).');
   const device = await adapter.requestDevice();
   const context = c.getContext('webgpu');
   const format = navigator.gpu.getPreferredCanvasFormat();
   context.configure({ device, format });

   const vertices = new Float32Array([-0.5, -0.5, 0.5, -0.5, 0.0, 0.7]);
   const vbuf = device.createBuffer({
      size: vertices.byteLength,
      usage: GPUBufferUsage.VERTEX,
      mappedAtCreation: true,
   });
   new Float32Array(vbuf.getMappedRange()).set(vertices);
   vbuf.unmap();

   const module = device.createShaderModule({ code: SHADER });
   const pipeline = device.createRenderPipeline({
      layout: 'auto',
      vertex: {
         module,
         entryPoint: 'vs_main',
         buffers: [{
            arrayStride: 8,
            attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x2' }],
         }],
      },
      fragment: {
         module,
         entryPoint: 'fs_main',
         targets: [{ format }],
      },
      primitive: { topology: 'triangle-list' },
   });

   const encoder = device.createCommandEncoder();
   const pass = encoder.beginRenderPass({
      colorAttachments: [{
         view: context.getCurrentTexture().createView(),
         clearValue: [0.1, 0.3, 0.1, 1],
         loadOp: 'clear',
         storeOp: 'store',
      }],
   });
   pass.setPipeline(pipeline);
   pass.setVertexBuffer(0, vbuf);
   pass.draw(3);
   pass.end();
   device.queue.submit([encoder.finish()]);
   console.log('hello-triangle: submitted');
})().catch((e) => console.error(e));
</script>
</body>
</html>
