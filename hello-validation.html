<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title>hello-validation</title>
   <script src="webgpu.js"></script>
</head>
<body>
<canvas id="c" width="400" height="300"></canvas>
<pre id="log"></pre>
<script>
const SHADER = `
struct VSOut {
   @builtin(position) pos: vec4f,
   @location(0) color: vec4f,
}

@vertex
fn vs_main(@location(0) pos: vec2f, @location(1) color: vec4f) -> VSOut {
   var o: VSOut;
   o.pos = vec4f(pos, 0.0, 1.0);
   o.color = color;
   return o;
}

@fragment
fn fs_main(@location(0) color: vec4f) -> @location(0) vec4f {
   return color;
}
`;

function log(msg) {
   console.log(msg);
   logEl: {
      const el = document.getElementById('log');
      if (el) el.textContent += msg + '\n';
   }
}

(async () => {
   const adapter = await navigator.gpu.requestAdapter();
   if (!adapter) throw new Error('No GPU adapter (WebGL 2 required).');

   let device = await adapter.requestDevice();
   const lostP = device.lost.then((info) => {
      log('device.lost: ' + (info && info.message));
   });
   device.destroy();
   const timeout = new Promise((_, bad) => {
      setTimeout(() => bad(new Error('Timed out waiting for device.lost')), 2000);
   });
   await Promise.race([lostP, timeout]);

   device = await adapter.requestDevice();
   const context = c.getContext('webgpu');
   const format = navigator.gpu.getPreferredCanvasFormat();
   context.configure({ device, format });

   device.pushErrorScope('validation');
   device.pushErrorScope('out-of-memory');
   device.createBuffer({
      size: 100 * 1000 * 1000 * 1000,
      usage: GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
   });
   const errOom = await device.popErrorScope();
   const errVal = await device.popErrorScope();
   log('out-of-memory scope: ' + (errOom && errOom.name));
   log('validation scope: ' + (errVal && errVal.name));

   const data = new ArrayBuffer(64);
   const f32 = new Float32Array(data);
   const u8 = new Uint8Array(data);
   const verts = [
      [-0.5, -0.5, 255, 0, 0, 180],
      [ 0.5, -0.5, 0, 255, 0, 180],
      [-0.5,  0.5, 0, 0, 255, 180],
      [ 0.5,  0.5, 255, 255, 0, 180],
   ];
   verts.forEach((v, i) => {
      f32[i * 4] = v[0];
      f32[i * 4 + 1] = v[1];
      u8[i * 16 + 8] = v[2];
      u8[i * 16 + 9] = v[3];
      u8[i * 16 + 10] = v[4];
      u8[i * 16 + 11] = v[5];
   });
   const vbuf = device.createBuffer({
      size: data.byteLength,
      usage: GPUBufferUsage.VERTEX,
      mappedAtCreation: true,
   });
   new Uint8Array(vbuf.getMappedRange()).set(u8);
   vbuf.unmap();
   const ibuf = device.createBuffer({
      size: 6,
      usage: GPUBufferUsage.INDEX,
      mappedAtCreation: true,
   });
   new Uint16Array(ibuf.getMappedRange()).set([0, 1, 3]);
   ibuf.unmap();

   const module = device.createShaderModule({ code: SHADER });
   const pipeline = device.createRenderPipeline({
      layout: 'auto',
      vertex: {
         module,
         entryPoint: 'vs_main',
         buffers: [{
            arrayStride: 16,
            attributes: [
               { shaderLocation: 0, offset: 0, format: 'float32x2' },
               { shaderLocation: 1, offset: 8, format: 'unorm8x4' },
            ],
         }],
      },
      fragment: {
         module,
         entryPoint: 'fs_main',
         targets: [{
            format,
            blend: {
               color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha' },
               alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' },
            },
         }],
      },
   });

   const encoder = device.createCommandEncoder();
   const pass = encoder.beginRenderPass({
      colorAttachments: [{
         view: context.getCurrentTexture().createView(),
         clearValue: [0.1, 0.3, 0.1, 1],
         loadOp: 'clear',
         storeOp: 'store',
      }],
   });
   pass.setPipeline(pipeline);
   pass.setVertexBuffer(0, vbuf);
   pass.draw(3);
   pass.setIndexBuffer(ibuf, 'uint16');
   pass.drawIndexed(3);
   pass.end();
   device.queue.submit([encoder.finish()]);
   log('hello-validation: submitted');
})().catch((e) => {
   console.error(e);
   const el = document.getElementById('log');
   if (el) el.textContent += String(e);
});
</script>
</body>
</html>
