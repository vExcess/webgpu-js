<!DOCTYPE html>
<html>
<head>
   <meta charset="utf-8">
   <title>hello-bind-groups</title>
   <script src="webgpu.js"></script>
</head>
<body>
<canvas id="c" width="400" height="300"></canvas>
<script>
const SHADER = `
struct Uniforms {
   color: vec4f,
}

@group(0) @binding(0) var u_tex: texture_2d<f32>;
@group(0) @binding(1) var u_samp: sampler;
@group(0) @binding(2) var<uniform> u: Uniforms;

struct VSOut {
   @builtin(position) pos: vec4f,
   @location(0) uv: vec2f,
}

@vertex
fn vs_main(@location(0) pos: vec2f) -> VSOut {
   var o: VSOut;
   o.pos = vec4f(pos * 2.0 - vec2f(1.0, 1.0), 0.0, 1.0);
   o.uv = pos;
   return o;
}

@fragment
fn fs_main(@location(0) uv: vec2f) -> @location(0) vec4f {
   return textureSample(u_tex, u_samp, uv) * u.color;
}
`;

(async () => {
   const adapter = await navigator.gpu.requestAdapter();
   if (!adapter) throw new Error('No GPU adapter (WebGL 2 required).');
   const device = await adapter.requestDevice();
   const context = c.getContext('webgpu');
   const format = navigator.gpu.getPreferredCanvasFormat();
   context.configure({ device, format });

   const vdata = new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]);
   const vbuf = device.createBuffer({
      size: vdata.byteLength,
      usage: GPUBufferUsage.VERTEX,
      mappedAtCreation: true,
   });
   new Float32Array(vbuf.getMappedRange()).set(vdata);
   vbuf.unmap();

   const idata = new Uint16Array([0, 1, 2, 2, 1, 3]);
   const ibuf = device.createBuffer({
      size: idata.byteLength,
      usage: GPUBufferUsage.INDEX,
      mappedAtCreation: true,
   });
   new Uint16Array(ibuf.getMappedRange()).set(idata);
   ibuf.unmap();

   const ALIGN = 256;
   const uData = new Float32Array(ALIGN / 4 + 4);
   uData.set([1, 1, 1, 0.85]);
   uData.set([1, 1, 0, 0.85], ALIGN / 4);
   const ubuf = device.createBuffer({
      size: uData.byteLength,
      usage: GPUBufferUsage.UNIFORM,
      mappedAtCreation: true,
   });
   new Float32Array(ubuf.getMappedRange()).set(uData);
   ubuf.unmap();

   const texels = new Uint8Array([
      255, 0, 255, 255,  0, 0, 0, 255,     255, 0, 255, 255,  0, 0, 0, 255,
      0, 0, 0, 255,      255, 0, 255, 255, 0, 0, 0, 255,      255, 0, 255, 255,
      255, 0, 255, 255,  0, 0, 0, 255,     255, 0, 255, 255,  0, 0, 0, 255,
      0, 0, 0, 255,      255, 0, 255, 255, 0, 0, 0, 255,      255, 0, 255, 255,
   ]);
   const texture = device.createTexture({
      size: [4, 4],
      format: 'rgba8unorm',
      usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
   });
   device.queue.writeTexture({ texture }, texels, { bytesPerRow: 16 }, [4, 4]);
   const sampler = device.createSampler({ magFilter: 'nearest', minFilter: 'nearest' });

   const module = device.createShaderModule({ code: SHADER });
   const bgl = device.createBindGroupLayout({
      entries: [
         { binding: 0, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'float' } },
         { binding: 1, visibility: GPUShaderStage.FRAGMENT, sampler: { type: 'filtering' } },
         { binding: 2, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform', hasDynamicOffset: true } },
      ],
   });
   const layout = device.createPipelineLayout({ bindGroupLayouts: [bgl] });
   const pipeline = device.createRenderPipeline({
      layout,
      vertex: {
         module,
         entryPoint: 'vs_main',
         buffers: [{
            arrayStride: 8,
            attributes: [{ shaderLocation: 0, offset: 0, format: 'float32x2' }],
         }],
      },
      fragment: {
         module,
         entryPoint: 'fs_main',
         targets: [{
            format,
            blend: {
               color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha' },
               alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' },
            },
         }],
      },
      primitive: { topology: 'triangle-list' },
   });
   const bg = device.createBindGroup({
      layout: bgl,
      entries: [
         { binding: 0, resource: texture.createView() },
         { binding: 1, resource: sampler },
         { binding: 2, resource: { buffer: ubuf, size: 16 } },
      ],
   });

   const encoder = device.createCommandEncoder();
   const pass = encoder.beginRenderPass({
      colorAttachments: [{
         view: context.getCurrentTexture().createView(),
         clearValue: [0.1, 0.3, 0.1, 1],
         loadOp: 'clear',
         storeOp: 'store',
      }],
   });
   pass.setPipeline(pipeline);
   pass.setVertexBuffer(0, vbuf);
   pass.setIndexBuffer(ibuf, 'uint16');
   pass.setBindGroup(0, bg, [0]);
   pass.drawIndexed(6);
   pass.setBindGroup(0, bg, [ALIGN]);
   pass.draw(3);
   pass.end();
   device.queue.submit([encoder.finish()]);
   console.log('hello-bind-groups: submitted');
})().catch((e) => console.error(e));
</script>
</body>
</html>
